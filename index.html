<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="GUNA - Portfolio & Interactive Robotics Workstation | ECE · Embedded Systems · Robotics · IoT · Applied ML">
    <title>GUNA | ECE & Robotics Engineering Workstation</title>
    <link rel="stylesheet" href="css/styles.css?v=44">
    <link rel="stylesheet" href="css/boot.css?v=44">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!-- ==========================================================================
         FLASHBANG & RADIAL REVEAL MASK LAYER (Source: loading.html)
         ========================================================================== -->
    <div id="flash"></div>

    <!-- ==========================================================================
         SYSTEM BOOT / LOADING SUBSYSTEM OVERLAY (Source: loading.html)
         ========================================================================== -->
    <div id="loader">
        <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
            <!-- main loop wiring -->
            <path class="trace" id="wire-top-left" d="M40,140 L40,30 L128,30" />
            <path class="trace" id="wire-top-right" d="M188,30 L320,30 L320,84" />
            <path class="trace" id="wire-bottom" d="M320,136 L320,190 L40,190 L40,140" />

            <!-- animated current flow overlay (same geometry, drawn on top) -->
            <path class="flow" id="flow-path"
                d="M40,140 L40,30 L128,30 M188,30 L320,30 L320,84 M320,136 L320,190 L40,190 L40,140"
                stroke-dasharray="6 10" />

            <!-- battery / power supply -->
            <g class="part" id="battery">
                <line x1="26" y1="118" x2="54" y2="118" stroke-width="4" />
                <line x1="32" y1="128" x2="48" y2="128" stroke-width="2" />
                <line x1="26" y1="152" x2="54" y2="152" stroke-width="4" />
                <line x1="32" y1="142" x2="48" y2="142" stroke-width="2" />
            </g>
            <text class="label" x="8" y="180">VCC</text>

            <!-- switch -->
            <g id="switch">
                <circle cx="128" cy="30" r="3" fill="var(--loader-trace-dim)" stroke="none" />
                <circle cx="188" cy="30" r="3" fill="var(--loader-trace-dim)" stroke="none" />
                <line id="switch-lever" class="part" x1="128" y1="30" x2="186" y2="30" stroke-width="3" />
            </g>
            <text class="label" x="140" y="18">SW1</text>

            <!-- LED -->
            <g id="led-body">
                <polygon class="part" points="320,96 306,120 334,120" />
                <line class="part" x1="306" y1="120" x2="334" y2="120" />
                <line class="part" x1="298" y1="90" x2="290" y2="80" />
                <line class="part" x1="308" y1="86" x2="300" y2="76" />
            </g>
            <text class="label" x="336" y="112">LED1</text>
        </svg>
    </div>

    <!-- ==========================================================================
         FULLSCREEN HERO WORKSTATION CONTAINER (Destination)
         ========================================================================== -->
    <main id="hero-container" class="hero-container">

        <!-- 3D Canvas Mount Point -->
        <div id="canvas-container" class="canvas-container"></div>

        <!-- Spatial Overlay Layer -->
        <div class="hero-overlay">

            <!-- Technical Framing / Corner Markers -->
            <div class="cell-marker top-left">
                <span class="marker-line"></span>
                <span class="marker-label">CELL-01 // SYS.LOC.00</span>
            </div>
            <div class="cell-marker top-right">
                <span class="marker-label">WORKSTATION v2.0</span>
                <span class="marker-line"></span>
            </div>
            <div class="cell-marker bottom-left">
                <span class="marker-line"></span>
                <span class="marker-label">COORDS: <span id="telemetry-coords">X:0.00 Y:0.00</span></span>
            </div>
            <div class="cell-marker bottom-right">
                <span class="marker-label">STATUS: <span id="telemetry-status" class="status-badge">ONLINE</span></span>
                <span class="marker-line"></span>
            </div>

            <!-- Identity Header Overlay -->
            <header class="identity-header">
                <div class="identity-tag">ECE · EMBEDDED SYSTEMS</div>
                <h1 class="identity-name">GUNA</h1>
                <div class="identity-sub">Robotics · IoT · Applied ML</div>
            </header>

            <!-- Technical Metadata Telemetry Bar -->
            <div class="telemetry-bar">
                <div class="telemetry-item">
                    <span class="telemetry-key">UNIT:</span>
                    <span class="telemetry-val">ARM-01</span>
                </div>
                <div class="telemetry-divider"></div>
                <div class="telemetry-item">
                    <span class="telemetry-key">STATE:</span>
                    <span id="state-display" class="telemetry-val state-active">NORMAL</span>
                </div>
                <div class="telemetry-divider"></div>
                <div class="telemetry-item">
                    <span class="telemetry-key">TRACKING:</span>
                    <span id="tracking-display" class="telemetry-val">ACTIVE</span>
                </div>
            </div>

            <!-- Phase 4 Spatial Interaction Hint Banner -->
            <div class="phase1-hint">
                <span class="hint-icon">⚙</span>
                <span>SPATIAL EXPLORATION READY — [HOVER] Object · [CLICK] Inspect in 360° · [DRAG] Orbit View</span>
            </div>

        </div>

    </main>

    <!-- Main ES Module Entry Point -->
    <script type="module" src="js/app.js?v=44"></script>
</body>

</html>

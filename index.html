<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guna — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sora:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #0a0e14;
    --panel-bg: #0d131b;
    --trace-dim: #2d3d4f;
    --trace-live: #5aa9e6;
    --amber: #e6b45a;
    --led-glow: #ff9d4d;
    --flash: #eaf2fb;
    --muted: #5c6f82;
    --tile-bg: #0f151d;
    --tile-border: #1f2d3d;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --display: 'Chakra Petch', var(--mono);
    --sans: 'Sora', -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--mono);
    color: #cfd8d3;
  }

  /* ================= MAIN CONTENT (real page) ================= */
  #main-content{
    position: fixed;
    inset: 0;
    filter: brightness(0.12);
    will-change: filter;
    overflow: hidden;
  }

  #bg-grid{
    position: absolute;
    inset: -30px;
    background-image: radial-gradient(rgba(90,169,230,0.22) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    pointer-events: none;
    animation: gridDrift 50s linear infinite alternate;
  }
  @keyframes gridDrift{
    0%{ background-position: 0 0; }
    100%{ background-position: 42px 30px; }
  }
  .corner{
    position: absolute; width: 30px; height: 30px;
    border-color: var(--trace-live);
    pointer-events: none;
    animation: cornerPulse 4.5s ease-in-out infinite;
  }
  .corner-tr{ animation-delay: 0.6s; }
  .corner-bl{ animation-delay: 1.2s; }
  .corner-br{ animation-delay: 1.8s; }
  @keyframes cornerPulse{
    0%, 100%{ opacity: 0.35; }
    50%{ opacity: 0.9; }
  }
  .corner-tl{ top: 26px; left: 26px; border-top: 2px solid; border-left: 2px solid; }
  .corner-tr{ top: 26px; right: 26px; border-top: 2px solid; border-right: 2px solid; }
  .corner-bl{ bottom: 26px; left: 26px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner-br{ bottom: 26px; right: 26px; border-bottom: 2px solid; border-right: 2px solid; }

  #hero{
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.6vh, 18px);
    text-align: center;
    padding: 24px 16px;
  }

  #hero-header .eyebrow{
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  #hero-header h1{
    color: var(--amber);
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.8rem, 5.4vw, 3.2rem);
    letter-spacing: 0.04em;
    margin: 0;
    animation: titleGlow 5s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%, 100%{ text-shadow: 0 0 0 rgba(230,180,90,0); }
    50%{ text-shadow: 0 0 22px rgba(230,180,90,0.4); }
  }
  #hero-header .sub{
    color: #8a9aab;
    font-family: var(--sans);
    font-weight: 300;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    margin: 6px 0 0;
  }

  #stage-wrap{
    position: relative;
    width: min(88vw, 128vh, 900px);
    aspect-ratio: 760 / 560;
  }
  #stage{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; }

  #scroll-cue{
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    pointer-events: none;
  }
  #scroll-cue .line{
    width: 1px;
    height: 24px;
    background: linear-gradient(var(--trace-live), transparent);
    animation: scrollPulse 1.8s ease-in-out infinite;
  }
  @keyframes scrollPulse{ 0%,100%{ opacity: 0.2; } 50%{ opacity: 1; } }

  /* ================= ARM (3D) + TILES ================= */
  #arm-3d{ position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  #arm-3d canvas{ display: block; width: 100%; height: 100%; }

  .tile{ cursor: pointer; pointer-events: all; }
  .tile-rect{
    fill: var(--tile-bg);
    stroke: var(--tile-border);
    stroke-width: 2.5;
    pointer-events: all;
    transition: stroke 0.2s ease, fill 0.2s ease;
    animation: tileBreathe 5.5s ease-in-out infinite;
  }
  .tile:nth-of-type(1) .tile-rect{ animation-delay: 0s; }
  .tile:nth-of-type(2) .tile-rect{ animation-delay: 1.3s; }
  .tile:nth-of-type(3) .tile-rect{ animation-delay: 2.6s; }
  .tile:nth-of-type(4) .tile-rect{ animation-delay: 3.9s; }
  @keyframes tileBreathe{
    0%, 100%{ stroke: var(--tile-border); }
    50%{ stroke: #33526c; }
  }
  .tile:hover .tile-rect{ stroke: var(--trace-live); fill: #121c28; animation-play-state: paused; }
  .tile-label{
    fill: #b7c6d6;
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    transition: fill 0.2s ease;
  }
  .tile-caption{
    fill: var(--muted);
    font-family: var(--sans);
    font-style: italic;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.02em;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }
  .tile:hover .tile-label{ fill: var(--amber); }
  .tile.grabbed{ opacity: 0; }

  /* ================= FULLSCREEN PANEL ================= */
  #panel{
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--panel-bg);
    display: none;
    overflow-y: auto;
    transform-origin: top left;
    will-change: transform;
  }
  #panel.open{ display: block; }
  #panel-inner{
    max-width: 760px;
    margin: 0 auto;
    padding: 90px 32px 64px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #panel.settled #panel-inner{ opacity: 1; }
  #panel h2{
    color: var(--amber);
    font-family: var(--display);
    font-weight: 700;
    letter-spacing: 0.03em;
    font-size: clamp(1.4rem, 3.5vw, 2.1rem);
    margin: 0 0 18px;
  }
  #panel p{ color: #a8b6c4; font-family: var(--sans); font-weight: 300; line-height: 1.7; font-size: 0.95rem; }
  #panel-close{
    position: fixed;
    top: 22px;
    right: 28px;
    background: transparent;
    border: 1px solid var(--tile-border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #panel-close:hover{ border-color: var(--trace-live); color: var(--trace-live); }

  /* ================= LOADER ================= */
  #loader{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: var(--bg);
    transition: opacity 0.35s ease;
  }
  #loader svg{ width: min(58vw, 380px); height: auto; overflow: visible; }

  .trace{ fill: none; stroke: var(--trace-dim); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.25s ease; }
  .trace.live{ stroke: var(--trace-live); }
  .flow{ fill: none; stroke: var(--trace-live); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .part{ stroke: var(--trace-dim); stroke-width: 3; fill: none; transition: stroke 0.25s ease; }
  .part.live{ stroke: var(--trace-live); }

  #switch-lever{
    transform-origin: 158px 30px;
    transform: rotate(-26deg);
    transition: transform 0.4s cubic-bezier(.4,0,.2,1);
  }
  #switch-lever.closed{ transform: rotate(0deg); }

  #led-body{
    transform-origin: 320px 110px;
    transition: transform 0.15s ease, filter 0.15s ease;
    filter: drop-shadow(0 0 0px transparent);
  }
  #led-body.overload{
    transform: scale(1.35);
    filter: drop-shadow(0 0 14px var(--led-glow)) drop-shadow(0 0 28px var(--flash));
  }
  #led-body.overload polygon,
  #led-body.overload line{ stroke: var(--flash); }

  .loader-label{ fill: var(--muted); font-size: 10px; letter-spacing: 0.06em; font-family: var(--mono); }

  /* ================= FLASH / RADIAL REVEAL ================= */
  #flash{
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--flash);
    pointer-events: none;
    opacity: 0;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0%, transparent 0%, #000 0%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 0%, transparent 0%, #000 0%);
  }

  @media (prefers-reduced-motion: reduce){
    #loader, #flash{ display: none !important; }
    #main-content{ filter: none !important; }
    #panel{ transition: none !important; }
  }
</style>
</head>
<body>

<div id="main-content">

<script>
/* ===================== LOADING SEQUENCE ===================== */
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var mainContent = document.getElementById('main-content');
  var loader = document.getElementById('loader');
  var flash = document.getElementById('flash');
  var switchLever = document.getElementById('switch-lever');
  var ledBody = document.getElementById('led-body');
  var flowPath = document.getElementById('flow-path');

  if (reduceMotion) {
    finish();
    return;
  }

  var flowLen = flowPath.getTotalLength();
  flowPath.style.strokeDasharray = flowLen;
  flowPath.style.strokeDashoffset = flowLen;

  var done = false;
  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  function setLoop(live){
    document.querySelectorAll('.trace').forEach(function(el){
      el.classList.toggle('live', live);
    });
  }

  at(450, function(){
    switchLever.classList.add('closed');
    setLoop(true);
  });

  at(750, function(){
    flowPath.style.transition = 'stroke-dashoffset 0.42s linear, opacity 0.1s linear';
    flowPath.style.opacity = '1';
    flowPath.style.strokeDashoffset = '0';
  });

  at(1150, function(){
    ledBody.classList.add('overload');
  });

  at(1230, function(){
    flash.style.transition = 'opacity 0.18s ease-out';
    flash.style.opacity = '0.85';
    loader.style.opacity = '0';
  });

  at(1470, function(){
    runReveal(950);
  });

  function runReveal(duration){
    var start = null;
    function step(ts){
      if (done) return;
      if (start === null) start = ts;
      var raw = Math.min((ts - start) / duration, 1);
      var eased = easeOutCubic(raw);
      var radius = eased * 145;
      flash.style.maskImage =
        'radial-gradient(circle at 50% 50%, transparent 0%, transparent ' + radius + '%, #000 ' + Math.min(radius + 2, 148) + '%)';
      flash.style.webkitMaskImage = flash.style.maskImage;
      flash.style.opacity = String(0.85 * (1 - eased * 0.9));
      mainContent.style.filter = 'brightness(' + (0.12 + eased * 0.88) + ')';
      if (raw < 1) {
        requestAnimationFrame(step);
      } else {
        finish();
      }
    }
    requestAnimationFrame(step);
  }

  function finish(){
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    mainContent.style.filter = 'none'; // explicit keyword — clears the effect without falling back to the dim base rule
    flash.style.opacity = '0';
    flash.style.pointerEvents = 'none';
    loader.style.opacity = '0';
    document.body.style.overflow = 'auto';
    setTimeout(function(){
      loader.style.display = 'none';
      flash.style.display = 'none';
    }, 400);
  }

  function skip(){ finish(); }
  window.addEventListener('click', skip, { once: true });
  window.addEventListener('keydown', skip, { once: true });
})();
</script>

<script>
/* ===================== 3D ARM + TILES ===================== */
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stageWrap = document.getElementById('stage-wrap');
  var armContainer = document.getElementById('arm-3d');
  var stage = document.getElementById('stage');
  var panel = document.getElementById('panel');
  var panelTitle = document.getElementById('panel-title');
  var panelBody = document.getElementById('panel-body');
  var panelClose = document.getElementById('panel-close');

  var BASE = { x: 0, y: 0 };
  var L1 = 2.1, L2 = 1.9;
  var MAX_REACH = (L1 + L2) * 0.97;
  var MIN_REACH = Math.abs(L1 - L2) * 1.15;

  var content = {
    summary:  { title: 'Summary',  body: 'A quick snapshot of who I am and what I build — ECE student, embedded systems and robotics focus.' },
    about:    { title: 'About',    body: 'Longer background: coursework, tools, how I got into hardware and firmware work.' },
    social:   { title: 'Social',   body: 'Links out — GitHub, LinkedIn, wherever else you want to be reachable.' },
    projects: { title: 'Projects', body: 'The project grid lives here — robotics builds, firmware work, hackathon entries.' }
  };

  var desired = { x: 0, y: 0.7 };
  var current = { x: 0, y: 0.7 };
  var grip = 0;
  var mode = 'idle';
  var pointerActive = false;

  /* ---------- Three.js scene setup ---------- */
  var scene = new THREE.Scene();

  // Orthographic camera: chosen specifically because it lets us translate the
  // camera to re-center the view without any perspective distortion — a
  // perspective camera can't be shifted like this without warping the object.
  var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
  var CAM_BASE_POS = { x: 0, y: 1.1, z: 8.85 };
  var CAM_LOOK_AT = { x: 0, y: 0.3, z: 0 };
  // World-height visible at the arm's z=0 plane under the ORIGINAL small-canvas
  // perspective camera (fov 32°, distance 8.85) — kept as a fixed reference so
  // the arm's apparent size/scale never changes, only the canvas grows around it.
  var WORLD_HEIGHT_REF = 2 * CAM_BASE_POS.z * Math.tan((32 * Math.PI / 180) / 2);

  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  renderer.domElement.style.background = 'transparent';
  armContainer.appendChild(renderer.domElement);

  function resizeRenderer(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var stageRect = stageWrap.getBoundingClientRect();
    if (vw === 0 || vh === 0 || stageRect.width === 0 || stageRect.height === 0) return;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(vw, vh, false);

    // Calibrate scale from stage-wrap's live size (same reference the old
    // small canvas used), so the arm keeps the exact same responsive scale.
    var pixelsPerWorldUnit = stageRect.height / WORLD_HEIGHT_REF;

    var halfW = (vw / 2) / pixelsPerWorldUnit;
    var halfH = (vh / 2) / pixelsPerWorldUnit;
    camera.left = -halfW; camera.right = halfW;
    camera.top = halfH; camera.bottom = -halfH;

    // Shift the camera so world origin still projects to stage-wrap's center
    // point (not the new full-viewport canvas's center) — this is what keeps
    // the arm anchored at its original screen position.
    var stageCenterPx = { x: stageRect.left + stageRect.width / 2, y: stageRect.top + stageRect.height / 2 };
    var viewportCenterPx = { x: vw / 2, y: vh / 2 };
    var offsetPxX = stageCenterPx.x - viewportCenterPx.x;
    var offsetPxY = stageCenterPx.y - viewportCenterPx.y;
    var offsetWorldX = -offsetPxX / pixelsPerWorldUnit;
    var offsetWorldY = offsetPxY / pixelsPerWorldUnit;

    camera.position.set(CAM_BASE_POS.x + offsetWorldX, CAM_BASE_POS.y + offsetWorldY, CAM_BASE_POS.z);
    camera.lookAt(CAM_LOOK_AT.x + offsetWorldX, CAM_LOOK_AT.y + offsetWorldY, CAM_LOOK_AT.z);
    camera.updateProjectionMatrix();
  }
  resizeRenderer();
  window.addEventListener('resize', resizeRenderer);
  if (window.ResizeObserver) {
    new ResizeObserver(resizeRenderer).observe(stageWrap);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(resizeRenderer);
  }

  scene.add(new THREE.AmbientLight(0x33445a, 0.65));
  var keyLight = new THREE.DirectionalLight(0x9fc6ee, 1.15);
  keyLight.position.set(2.5, 3, 4);
  scene.add(keyLight);
  var rimLight = new THREE.DirectionalLight(0xe6b45a, 0.45);
  rimLight.position.set(-3, -1.5, 2);
  scene.add(rimLight);
  var grabLight = new THREE.PointLight(0xe6b45a, 0, 6, 2);
  scene.add(grabLight);

  var bodyMat = new THREE.MeshStandardMaterial({ color: 0x141b24, metalness: 0.7, roughness: 0.35, emissive: 0x0d2a3f, emissiveIntensity: 0.3 });
  var jointMat = new THREE.MeshStandardMaterial({ color: 0x0d131b, metalness: 0.55, roughness: 0.4, emissive: 0x5aa9e6, emissiveIntensity: 0.55 });
  var clawMat = new THREE.MeshStandardMaterial({ color: 0x1a140a, metalness: 0.6, roughness: 0.3, emissive: 0xe6b45a, emissiveIntensity: 0.55 });

  var baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.55, 0.26, 28), bodyMat);
  scene.add(baseMesh);

  var upperArmGeo = new THREE.CylinderGeometry(0.12, 0.15, 1, 16);
  var forearmGeo = new THREE.CylinderGeometry(0.09, 0.12, 1, 16);
  var clawGeo = new THREE.CylinderGeometry(0.03, 0.055, 1, 10);
  var jointGeo = new THREE.SphereGeometry(0.16, 20, 20);
  var wristGeo = new THREE.SphereGeometry(0.13, 20, 20);

  var upperArmMesh = new THREE.Mesh(upperArmGeo, bodyMat);
  var elbowMesh = new THREE.Mesh(jointGeo, jointMat);
  var forearmMesh = new THREE.Mesh(forearmGeo, bodyMat);
  var wristMesh = new THREE.Mesh(wristGeo, jointMat);
  var clawAMesh = new THREE.Mesh(clawGeo, clawMat);
  var clawBMesh = new THREE.Mesh(clawGeo, clawMat);
  scene.add(upperArmMesh, elbowMesh, forearmMesh, wristMesh, clawAMesh, clawBMesh);

  var UP = new THREE.Vector3(0, 1, 0);
  function setBone(mesh, p1, p2, minLen){
    var dir = new THREE.Vector3().subVectors(p2, p1);
    var len = Math.max(dir.length(), minLen || 0.01);
    mesh.position.lerpVectors(p1, p2, 0.5);
    mesh.scale.set(1, len, 1);
    var axis = dir.clone().normalize();
    if (axis.lengthSq() > 0.0001) {
      mesh.quaternion.setFromUnitVectors(UP, axis);
    }
  }

  /* ---------- screen <-> 3D world conversion ---------- */
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();
  var groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

  function clientToWorld(clientX, clientY){
    var vw = window.innerWidth, vh = window.innerHeight;
    if (vw === 0 || vh === 0) return { x: 0, y: 0 };
    ndc.x = (clientX / vw) * 2 - 1;
    ndc.y = -((clientY / vh) * 2 - 1);
    raycaster.setFromCamera(ndc, camera);
    var pt = new THREE.Vector3();
    var hit = raycaster.ray.intersectPlane(groundPlane, pt);
    return hit ? { x: pt.x, y: pt.y } : { x: 0, y: 0 };
  }

  function tileWorldCenter(el){
    var rect = el.querySelector('.tile-rect').getBoundingClientRect();
    return clientToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  function clampToReach(p){
    var dx = p.x - BASE.x, dy = p.y - BASE.y;
    var d = Math.hypot(dx, dy);
    if (d < 1e-4) return { x: BASE.x + MIN_REACH, y: BASE.y };
    var clamped = Math.min(Math.max(d, MIN_REACH), MAX_REACH);
    var s = clamped / d;
    return { x: BASE.x + dx * s, y: BASE.y + dy * s };
  }

  function solveIK(target){
    var dx = target.x - BASE.x, dy = target.y - BASE.y;
    var d = Math.min(Math.max(Math.hypot(dx, dy), MIN_REACH), MAX_REACH);
    var a = Math.atan2(dy, dx);
    var cosA0 = (L1*L1 + d*d - L2*L2) / (2 * L1 * d);
    cosA0 = Math.min(1, Math.max(-1, cosA0));
    var a0 = Math.acos(cosA0);
    var shoulderAngle = a - a0;
    var elbow = {
      x: BASE.x + L1 * Math.cos(shoulderAngle),
      y: BASE.y + L1 * Math.sin(shoulderAngle)
    };
    var cosA1 = (L1*L1 + L2*L2 - d*d) / (2 * L1 * L2);
    cosA1 = Math.min(1, Math.max(-1, cosA1));
    var a1 = Math.acos(cosA1);
    var forearmAngle = shoulderAngle + (Math.PI - a1);
    var wrist = {
      x: elbow.x + L2 * Math.cos(forearmAngle),
      y: elbow.y + L2 * Math.sin(forearmAngle)
    };
    return { elbow: elbow, wrist: wrist, forearmAngle: forearmAngle };
  }

  var clock = { t: 0 };

  function render(){
    var solved = solveIK(current);
    var shoulderP = new THREE.Vector3(BASE.x, BASE.y, 0);
    var elbowP = new THREE.Vector3(solved.elbow.x, solved.elbow.y, 0);
    var wristP = new THREE.Vector3(solved.wrist.x, solved.wrist.y, 0);

    setBone(upperArmMesh, shoulderP, elbowP, 0.05);
    elbowMesh.position.copy(elbowP);
    setBone(forearmMesh, elbowP, wristP, 0.05);
    wristMesh.position.copy(wristP);

    var openAngle = 0.5 - grip * 0.42;
    var prongLen = 0.42;
    var a1 = solved.forearmAngle + openAngle;
    var a2 = solved.forearmAngle - openAngle;
    var tipA = new THREE.Vector3(wristP.x + prongLen * Math.cos(a1), wristP.y + prongLen * Math.sin(a1), 0);
    var tipB = new THREE.Vector3(wristP.x + prongLen * Math.cos(a2), wristP.y + prongLen * Math.sin(a2), 0);
    setBone(clawAMesh, wristP, tipA, 0.02);
    setBone(clawBMesh, wristP, tipB, 0.02);

    grabLight.position.copy(wristP).setZ(0.6);
    grabLight.intensity = grip * 2.2;

    baseMesh.material.emissiveIntensity = 0.3 + Math.sin(clock.t * 0.0022) * 0.12;

    renderer.render(scene, camera);
  }

  function onPointerMove(e){
    if (mode !== 'idle') return;
    pointerActive = true;
    var p = clientToWorld(e.clientX, e.clientY);
    desired = clampToReach(p);
  }
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerleave', function(){ pointerActive = false; });

  function idleSway(t){
    var angle = t * 0.0006;
    return clampToReach({
      x: BASE.x + Math.cos(angle) * (MAX_REACH * 0.48),
      y: BASE.y + Math.sin(angle) * (MAX_REACH * 0.2) + 0.95
    });
  }

  function tween(duration, onFrame, onDone){
    var start = null;
    function ease(t){ return 1 - Math.pow(1 - t, 3); }
    function step(ts){
      if (start === null) start = ts;
      var raw = Math.min((ts - start) / duration, 1);
      onFrame(ease(raw), raw);
      if (raw < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function loop(ts){
    clock.t = ts;
    if (mode === 'idle') {
      if (!pointerActive) desired = idleSway(ts);
      current.x += (desired.x - current.x) * 0.28;
      current.y += (desired.y - current.y) * 0.28;
      grip += (0 - grip) * 0.2;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function openPanel(key, tileEl){
    if (mode !== 'idle') return;
    mode = 'reaching';
    var tilePos = tileWorldCenter(tileEl);
    var startPos = { x: current.x, y: current.y };

    if (reduceMotion) {
      launchPanel(key, tileEl);
      mode = 'idle';
      return;
    }

    tween(320, function(e){
      current.x = startPos.x + (tilePos.x - startPos.x) * e;
      current.y = startPos.y + (tilePos.y - startPos.y) * e;
    }, function(){
      mode = 'grabbing';
      tween(150, function(e){
        grip = e;
      }, function(){
        tileEl.classList.add('grabbed');
        launchPanel(key, tileEl);
      });
    });
  }

  function launchPanel(key, tileEl){
    var data = content[key] || { title: tileEl.getAttribute('data-title'), body: '' };
    panelTitle.textContent = data.title;
    panelBody.textContent = data.body;

    var rect = tileEl.querySelector('.tile-rect').getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var scaleX = rect.width / vw, scaleY = rect.height / vh;
    var originX = rect.left + rect.width / 2;
    var originY = rect.top + rect.height / 2;

    panel.style.transition = 'none';
    panel.style.transform =
      'translate(' + (originX - vw/2) + 'px,' + (originY - vh/2) + 'px) scale(' + scaleX + ',' + scaleY + ')';
    panel.classList.add('open');
    void panel.offsetWidth;

    panel.style.transition = reduceMotion ? 'none' : 'transform 0.45s cubic-bezier(.4,0,.2,1)';
    panel.style.transform = 'translate(0,0) scale(1,1)';

    setTimeout(function(){
      panel.classList.add('settled');
    }, reduceMotion ? 0 : 420);

    mode = 'expanded';
    panel.dataset.activeTile = key;
  }

  function closePanel(){
    if (mode !== 'expanded') return;
    var key = panel.dataset.activeTile;
    var tileEl = document.querySelector('.tile[data-key="' + key + '"]');
    var rect = tileEl.querySelector('.tile-rect').getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var scaleX = rect.width / vw, scaleY = rect.height / vh;
    var originX = rect.left + rect.width / 2;
    var originY = rect.top + rect.height / 2;

    panel.classList.remove('settled');
    panel.style.transition = reduceMotion ? 'none' : 'transform 0.4s cubic-bezier(.4,0,.2,1)';
    panel.style.transform =
      'translate(' + (originX - vw/2) + 'px,' + (originY - vh/2) + 'px) scale(' + scaleX + ',' + scaleY + ')';

    var finish = function(){
      panel.classList.remove('open');
      tileEl.classList.remove('grabbed');
      mode = 'releasing';
      tween(150, function(e){
        grip = 1 - e;
      }, function(){
        mode = 'idle';
        desired = { x: current.x, y: current.y };
      });
    };
    if (reduceMotion) finish();
    else setTimeout(finish, 400);
  }

  stage.addEventListener('click', function(e){
    var tileEl = e.target.closest('.tile');
    if (!tileEl) return;
    openPanel(tileEl.getAttribute('data-key'), tileEl);
  });
  panelClose.addEventListener('click', closePanel);
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closePanel();
  });

  render();
})();
</script>
</body>
</html>
